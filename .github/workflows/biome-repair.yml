name: Biome repair
permissions:
  contents: write
  pull-requests: read
  actions: write
concurrency:
  group: biome-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  repair:
    uses: edbfi/automation/.github/workflows/biome-repair.yml@v2.0.0
    secrets:
      repair-app-private-key: ${{ secrets.RENOVATE_REPAIR_APP_PRIVATE_KEY }}
    with:
      repair-app-client-id: ${{ vars.RENOVATE_REPAIR_APP_CLIENT_ID }}
      config-files: |
        biome.json
        frontend/biome.json
      source-roots: |
        frontend/src
        frontend/vite.config.ts
        frontend/vitest-setup.ts
        frontend/svelte.config.js
        frontend/uno.config.ts
        frontend/tsconfig.json
      bun-version: 1.4.2
      package-directory: frontend
  canary:
    uses: edbfi/automation/.github/workflows/biome-repair.yml@v2.0.0
    secrets:
      repair-app-private-key: ${{ secrets.RENOVATE_REPAIR_APP_PRIVATE_KEY }}
    with:
      repair-app-client-id: ${{ vars.RENOVATE_REPAIR_APP_CLIENT_ID }}
      config-files: automation-canary/biome.json
      source-roots: automation-canary/sample.ts
      bun-version: 1.4.2
      package-directory: automation-canary
'on':
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
