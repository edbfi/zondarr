name: ci
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    uses: edbfi/automation/.github/workflows/python.yml@v4.1.1
    with:
      version: '3.14'
      command: bash .github/scripts/check-python.sh
      timeout-minutes: 30
  frontend:
    uses: edbfi/automation/.github/workflows/bun.yml@v4.1.1
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      install-directory: frontend
      working-directory: frontend
      command: bun run check:biome && bun run check && bun run test
  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version-file: frontend/package.json
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.21.0
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        version: latest
        enable-cache: true
    - name: Log resolved runtime versions
      run: uv --version && python --version && bun --version && node --version
    - uses: actions/cache@v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('frontend/bun.lock') }}
    - name: Install frozen application dependencies
      run: |-
        bun install --cwd frontend --frozen-lockfile
        uv sync --project backend --frozen --all-extras
    - name: Install Chromium for required browser startup smoke
      run: bun run --cwd frontend smoke:install --with-deps
    - name: Build frontend and verify generated API declarations
      run: |-
        bun run --cwd frontend build
        bun .github/scripts/check-api.ts
    - name: Retain normalized API drift diagnostics
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: api-declaration-diff
        path: ${{ runner.temp }}/zondarr-api-diff
        if-no-files-found: ignore
        retention-days: 7
    - name: Smoke both production servers and migrations
      run: python .github/scripts/smoke.py
    - name: Retain browser failure evidence
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: production-browser-smoke
        path: frontend/test-results
        if-no-files-found: ignore
        retention-days: 7
    - name: Reject tracked-file mutation
      run: git diff --exit-code HEAD
  hygiene:
    uses: edbfi/automation/.github/workflows/bun.yml@v4.1.1
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: SKIP=no-commit-to-branch,biome,ruff-check,ruff-format bunx --no-install prek run --all-files --hook-stage
        manual
  required:
    name: ci / required
    if: always()
    needs:
    - python
    - frontend
    - integration
    - hygiene
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
    - uses: edbfi/automation/actions/gate@v4.1.1
      with:
        needs: ${{ toJSON(needs) }}
        required: python frontend integration hygiene
