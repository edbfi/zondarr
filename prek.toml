# prek.toml — pre-commit hooks configuration
# Docs: https://prek.j178.dev/configuration/
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.3.2"
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
default_stages = ["pre-commit", "manual"]

# Builtin hooks — fast, offline, Rust-native
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "detect-private-key" },
  { id = "check-json", exclude = "^frontend/.*tsconfig.*\\.json$" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Conventional Commits — enforce Conventional Commit message format
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard — fixtures and dotfiles must never carry tokens
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

# Local hooks — project-specific quality gates
[[repos]]
repo = "local"
hooks = [
  { id = "biome", name = "Format and lint with Biome", entry = "./node_modules/.bin/biome check --write --files-ignore-unknown=true --no-errors-on-unmatched", language = "system", types_or = ["javascript", "ts", "svelte", "json", "css"], files = "^frontend/", exclude = "^frontend/(build|\\.svelte-kit|node_modules)/" },
  { id = "typecheck-ts", name = "TypeScript Check", entry = "bun run --cwd frontend check", language = "system", pass_filenames = false, files = "^frontend/", stages = ["pre-push"] },
  { id = "typecheck-py", name = "Python Type Check (basedpyright)", entry = "bash -c 'uv run --project backend --frozen basedpyright --project backend/pyproject.toml && uv run --project backend --frozen basedpyright --project dev_cli/pyproject.toml'", language = "system", files = "^(backend/|dev_cli/)", pass_filenames = false, stages = ["pre-push"] },
  { id = "tests-py", name = "Python Tests", entry = "bash -c '(cd backend && uv run --frozen pytest -n 4) && backend/.venv/bin/pytest -q dev_cli/tests'", language = "system", files = "^(backend/|dev_cli/)", pass_filenames = false, stages = ["pre-push"] },
  { id = "tests-ts", name = "Frontend Tests", entry = "bun run --cwd frontend test", language = "system", files = "^frontend/", pass_filenames = false, stages = ["pre-push"] },
  { id = "ruff-check", name = "Locked Python lint", entry = "uv run --project backend --frozen ruff check --fix", language = "system", types = ["python"], files = "^(backend/|dev_cli/).*\\.py$" },
  { id = "ruff-format", name = "Locked Python format", entry = "uv run --project backend --frozen ruff format", language = "system", types = ["python"], files = "^(backend/|dev_cli/).*\\.py$" },
]
